/* Shared shell supplies typography, button styling and panel surfaces. */
.mgr { --mgr-line: #e2e5e9; --mgr-muted: #687382; --mgr-ink: #171e2c; --mgr-accent: #f26738; --mgr-teal: #3e9481; display: grid; gap: 18px; min-width: 0; }
.mgr *, .mgr *::before, .mgr *::after { box-sizing: border-box; }
.mgr .mgr-panel, .mgr .mgr-data-card { min-width: 0; padding: clamp(18px, 2.4vw, 32px); }
.mgr p, .mgr h2, .mgr h3 { margin: 0; }
.mgr .mgr-intro > h2, .mgr .mgr-data-card > h3 { margin: 4px 0 7px; line-height: 1.45; }
.mgr .mgr-intro > h2 { font-size: 1.3rem; }
.mgr .mgr-data-card > h3 { font-size: 1.08rem; }
.mgr .eyebrow { letter-spacing: .14em; font-size: .66rem; font-weight: 750; }
.mgr .muted { color: var(--mgr-muted); }
.mgr .mgr-intro > .muted, .mgr .mgr-data-card > .muted, .mgr .mgr-form-foot .muted { font-size: .85rem; line-height: 1.7; }
.mgr .mgr-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.mgr button { cursor: pointer; }
.mgr button:disabled { opacity: .45; cursor: default; }
.mgr :is(button,input,select,[tabindex]):focus-visible { outline: 2px solid var(--mgr-teal); outline-offset: 2px; }
.mgr .mgr-toolbar { display: grid; grid-template-columns: minmax(130px,1.8fr) repeat(2,minmax(108px,.9fr)) auto; align-items: end; gap: 10px; margin: 22px 0 16px; }
.mgr .mgr-field { min-width: 0; display: grid; gap: 6px; }
.mgr .mgr-label { color: var(--mgr-muted); font-size: .75rem; font-weight: 650; }
.mgr input:not([type='file']), .mgr select { min-width: 0; width: 100%; height: 39px; padding: 0 10px; border: 1px solid var(--mgr-line); border-radius: 8px; background: #fff; color: var(--mgr-ink); font: inherit; font-size: .82rem; }
.mgr input::placeholder { color: #7b8490; }
.mgr .mgr-quiet { font-size: .77rem; min-height: 39px; }

.mgr .mgr-scroll { max-width: 100%; overflow-x: auto; }

.mgr .mgr-table :is(th,td) { border-bottom: 1px solid var(--mgr-line); padding: 11px 8px; }
.mgr .mgr-table th { color: var(--mgr-muted); background: #f7f8fa; font-size: .73rem; white-space: nowrap; }
.mgr .mgr-table :is(th:nth-child(5),td:nth-child(5)) { text-align: right; }
.mgr .mgr-table td { overflow-wrap: anywhere; }
.mgr .mgr-detail { min-width: 120px; max-width: 290px; }
.mgr .mgr-detail > :is(b,small) { display: block; }
.mgr .mgr-detail small { margin-top: 2px; font-size: .72rem; }
.mgr .mgr-kind { display: inline-flex; justify-content: center; align-items: center; min-width: 40px; padding: 3px 8px; border-radius: 20px; font-size: .7rem; font-weight: 650; white-space: nowrap; }
.mgr .mgr-income { background: #e4f4ef; color: #297563; }
.mgr .mgr-expense { background: #fff0e9; color: #a44b2b; }
.mgr .mgr-transfer { background: #edf0f6; color: #55627b; }
.mgr .mgr-money, .mgr .mgr-date { font-variant-numeric: tabular-nums; white-space: nowrap; }
.mgr .mgr-money { font-weight: 680; }
.mgr .mgr-money-income { color: #297563; }
.mgr .mgr-actions, .mgr .mgr-pager { display: flex; align-items: center; gap: 5px; }
.mgr .mgr-small { padding: 4px 8px; min-height: 30px; white-space: nowrap; font-size: .73rem; }
.mgr .mgr-danger { color: #a23f2c; }

/* PayPay consumer transaction history (not PayPay for Business / card statements).
 * Official fields: https://paypay.ne.jp/help/c0447/ ; transaction types: /help/c0141/.
 * await PayPayCSV.read(file) -> {rows, skipped, warnings}; no uploads or persistence.
 * A bad file/header/CSV syntax rejects the promise rather than yielding a partial file.
 */
(() => {
  'use strict';
  const norm = s => s.normalize('NFKC').trim();
  const absent = s => /^(?:|[-–—−])$/.test(norm(s));

  async function decode(file) {
    if (!file || typeof file.arrayBuffer !== 'function') throw new Error('CSVファイルを選択してください。');
    const bytes = new Uint8Array(await file.arrayBuffer());
    try { return new TextDecoder('utf-8', {fatal: true}).decode(bytes); } catch {
      if (!(bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf)) {
        try { return new TextDecoder('shift_jis', {fatal: true}).decode(bytes); } catch { /* invalid CP932 */ }

  }

  // start lines rather than record indices so warnings still locate multiline records.
  function* records(text) {
    text = text.replace(/\r\n?/g, '\n');
    let cells = [], field = '', quoted = false, closed = false, line = 1, start = 1;
    for (let i = 0; i <= text.length; i++) {
      const c = text[i];

        if (c === undefined) throw new Error(`${start}行目：CSVの引用符が閉じていません。`);

          if (text[i + 1] === '"') { field += '"'; i++; } else { quoted = false; closed = true; }

        cells.push(field); field = ''; closed = false;
        if (c !== ',') {
          if (cells.length > 1 || cells[0].trim()) yield {cells, start};
          cells = []; start = ++line;
        }
      } else if (closed || c === '"') {
        if (closed || field) throw new Error(`${line}行目：CSVの引用符が不正です。`);
        quoted = true;

    date: ['取引日', '取引日時'], out: ['出金金額(円)', '出金金額'], in: ['入金金額(円)', '入金金額'],
    kind: ['取引内容'], party: ['取引先'], method: ['取引方法'], id: ['取引番号', '取引ID'],
    status: ['ステータス', '取引ステータス', '取引状態', '取引状況', '状態']

      const name = norm(header).replace(/\s+/g, '');

        if (k in cols) throw new Error(`見出し「${name}」が重複しています。`);

  }

  async function read(file) {
    const text = await decode(file);
    if (text.includes('\0')) throw new Error('CSVに読み取れない文字があります。UTF-8またはShift_JISのCSVを選択してください。');

      const skip = why => { skipped++; warnings.push(`${start}行目：${why}（除外）`); };
      if (cells.length !== headers.length) { skip('列数が見出しと一致しません'); continue; }

        skip(`完了を確認できない取引です：${status || kind}`); continue;
      }

      if (!stamp) { skip('取引日が不正です'); continue; }
      const debit = yen(get('out')), credit = yen(get('in'));

        skip('円の出金・入金の片方だけに正の整数が必要です'); continue;
      }

      const [type, category, inferred] = classify(kind, norm(party), outgoing);

      const id = get('id'), direction = outgoing ? 'out' : 'in';

      // long IDs to JS numbers or collapse separate events merely sharing an order.
      const fingerprint = JSON.stringify([stamp, kind, direction, amount, party, get('method')]);
      let key;
      if (!absent(id)) {
        key = 'paypay:id:' + JSON.stringify([id, kind, direction]);
        if (seen.has(key)) {
          skip(seen.get(key) === fingerprint ? '同一の取引番号・取引内容が重複しています' : '同一の取引番号・取引内容で明細が異なります。先の行を採用しました'); continue;
        }
        seen.set(key, fingerprint);
      } else {
        // Keep genuinely identical-looking purchases; numbering is local to a
        // fingerprint, not the file, filename or row index. No secure context needed.
        const count = (occurrences.get(fingerprint) || 0) + 1;
        occurrences.set(fingerprint, count); noId++;
        key = `paypay:row:${fingerprint}:${count}`;
      }
      if (inferred) warnings.push(`${start}行目：「${kind}」は金額の向きから${outgoing ? '支出' : '収入'}としました。分類を確認してください。`);

    }
    if (noId) warnings.push(`取引番号のない${noId}件は日時・取引内容などで照合します。重複する期間を取り込む場合は明細を確認してください。`);
    if (!rows.length && !skipped) warnings.push('見出しだけで、取り込める取引がありません。');
    return {rows, skipped, warnings};
  }
  window.PayPayCSV = Object.freeze({read});
})();

    // Preserve the exact transaction title; never silently broaden its match by truncating it.
    const prefix=typeof initial?.prefix==='string'?initial.prefix:'';
    return {prefix,type,category,scope:initial?.scope==='all'?'all':'month',month};
  }
  function open(initial) {
    const L=window.Ledger,U=window.TallyUI,prefs=window.TallyPrefs;
    if(!prefs?.norm || !prefs.upsertRule || !L?.rules || !L?.saveBatch) {L?.toast('一括分類を読み込めませんでした。');return;}
    const demo=L.isDemo(), month=L.month(), esc=L.escape, $=id=>document.getElementById(id);
    const scopeText=s=>s.scope==='month'?s.month.replace('-','年')+'月':'全期間';
    const settings=initialForm(initial,month,t=>L.categories(t));
    let plan=null, selected=new Set(), page=0, future=true, expectedRules='', prior, busy=false;
    const closeButton=()=>{if($('bulk-cancel'))$('bulk-cancel').onclick=U.close};
    const getRuleText=()=>!future?'保存しない':prior?.category===plan.spec.category?'登録済み（変更なし）':prior?'更新':'新規登録';
    function configure(){
      U.dialog('カテゴリを一括変更',`<form id="bulk-form" class="bulk-dialog"><div class="form-grid"><label class="field full">取引名の先頭<input id="bulk-prefix" required maxlength="150" value="${esc(settings.prefix)}" placeholder="例：ファミリーマート" autocomplete="off"></label><label class="field">種別<select id="bulk-type"><option value="expense">支出</option><option value="income">収入</option></select></label><label class="field">変更先カテゴリ<select id="bulk-category" required></select></label><label class="field full">既存の取引の対象期間<select id="bulk-scope"><option value="month">選択月（${esc(month)}）</option><option value="all">全期間</option></select></label></div><label class="bulk-check"><input id="bulk-future" type="checkbox"${future?' checked':''}>今後の取引にも適用</label><p class="bulk-error" id="bulk-error" role="alert"></p><div class="dialog-actions"><button id="bulk-cancel" class="btn" type="button">キャンセル</button><button id="bulk-preview" class="btn primary" type="submit">プレビュー</button></div></form>`,'BATCH CATEGORY');
      const type=$('bulk-type'),cat=$('bulk-category');type.value=settings.type;$('bulk-scope').value=settings.scope;
      const opts=()=>{cat.innerHTML='<option value="">選択してください</option>'+L.categories(type.value).map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')};opts();cat.value=settings.category;type.onchange=opts;closeButton();
      $('bulk-form').onsubmit=event=>{event.preventDefault();Object.assign(settings,{prefix:$('bulk-prefix').value,type:type.value,category:cat.value,scope:$('bulk-scope').value});future=$('bulk-future').checked;
        try{if(L.isDemo()!==demo||L.month()!==month)throw stale();if(future && (settings.prefix.trim().length>150 || prefs.norm(settings.prefix).length>150))throw Error('今後のルールとして保存する場合は、先頭の文字列を150文字以内に短くしてください。');plan=preview(L.rows(),settings,t=>L.categories(t),prefs.norm);const rules=L.rules();expectedRules=ruleStamp(rules);prior=prevRule(rules,plan.spec,prefs.norm);selected=new Set(plan.matches.map(r=>r.id));page=0;showPreview()}catch(err){$('bulk-error').textContent=err.message}
      };
    }
    function showPreview(){
      const s=plan.spec,n=plan.matches.length;
      U.dialog('変更内容のプレビュー',`<div class="bulk-dialog"><div class="bulk-tags"><span>${esc(TYPES[s.type])}</span><span>${esc(scopeText(s))}</span><span>${demo?'デモデータ':'自分の家計簿'}</span></div><p class="bulk-condition"><b>${esc(s.prefix)}</b> で始まる取引 → <strong>${esc(s.category)}</strong></p><div class="bulk-controls"><label class="bulk-check"><input id="bulk-select-all" type="checkbox">全候補を選択</label><span id="bulk-count" role="status"></span></div><div class="bulk-list" id="bulk-list"></div><div class="bulk-pager" id="bulk-pager"></div><p class="bulk-hint">変更済みのため除外：${plan.unchanged}件 ／ 今後のルール：${getRuleText()}</p><div class="dialog-actions"><button id="bulk-back" type="button" class="btn">条件に戻る</button><button id="bulk-next" type="button" class="btn primary">確認へ</button></div></div>`,'BATCH PREVIEW');
      const all=$('bulk-select-all'),next=$('bulk-next'),ruleChange=future&&prior?.category!==s.category;
      function counts(){all.checked=n>0&&selected.size===n;all.indeterminate=selected.size>0&&selected.size<n;all.disabled=!n;$('bulk-count').textContent=`変更予定 ${selected.size} / ${n}件`;next.disabled=!selected.size&&!ruleChange}
      function list(){const start=page*PAGE_SIZE,pages=Math.ceil(n/PAGE_SIZE),list=$('bulk-list');list.innerHTML=plan.matches.slice(start,start+PAGE_SIZE).map((r,j)=>`<label class="bulk-row"><input type="checkbox" data-i="${start+j}" ${selected.has(r.id)?'checked':''}><span><b>${esc(r.title)}</b><small>${esc(r.date)} · ${esc(L.yen(r.amount))}</small></span><span class="bulk-change">${esc(r.category)} → <strong>${esc(s.category)}</strong></span></label>`).join('')||'<p class="empty">変更候補はありません。</p>';list.scrollTop=0;
        for(const box of list.querySelectorAll('[data-i]'))box.onchange=()=>{const id=plan.matches[Number(box.dataset.i)].id;if(box.checked)selected.add(id);else selected.delete(id);counts()};
        $('bulk-pager').innerHTML=pages>1?`<button id="bulk-prev-page" class="btn" ${page===0?'disabled':''}>前へ</button><small>${page+1} / ${pages}</small><button id="bulk-next-page" class="btn" ${page+1===pages?'disabled':''}>次へ</button>`:'';if(pages>1){$('bulk-prev-page').onclick=()=>{page--;listPage()};$('bulk-next-page').onclick=()=>{page++;listPage()}}counts()
      }
      const listPage=list;all.onchange=()=>{selected=new Set(all.checked?plan.matches.map(r=>r.id):[]);listPage()};$('bulk-back').onclick=configure;next.onclick=confirm;listPage();
    }
    function confirm(){const s=plan.spec;
      U.dialog('カテゴリの変更を確定',`<div class="bulk-dialog"><dl class="bulk-summary"><dt>保存先</dt><dd>${demo?'デモデータ':'自分の家計簿'}</dd><dt>取引名の先頭</dt><dd>${esc(s.prefix)}</dd><dt>対象期間</dt><dd>${esc(scopeText(s))}</dd><dt>変更先</dt><dd>${esc(TYPES[s.type])} ／ ${esc(s.category)}</dd><dt>既存の取引</dt><dd><strong>${selected.size}件を変更</strong></dd><dt>今後のルール</dt><dd>${getRuleText()}${future&&prior&&prior.category!==s.category?'：'+esc(prior.category)+' → '+esc(s.category):''}</dd></dl><p class="bulk-error" id="bulk-error" role="alert"></p><div class="dialog-actions"><button type="button" class="btn" id="bulk-back">戻る</button><button type="button" class="btn primary" id="bulk-apply">${selected.size?'確定して変更':'ルールを保存'}</button></div></div>`,'CONFIRM CHANGE');
      $('bulk-back').onclick=showPreview;const apply=$('bulk-apply');apply.onclick=()=>{if(busy)return;busy=true;apply.disabled=true;
        try{commit({L,prefs,plan,chosen:selected,future,demo,expectedRules})}catch(err){$('bulk-error').textContent=err.message||'保存できませんでした。';$('bulk-back').textContent='条件に戻る';$('bulk-back').onclick=configure;busy=false;return}
        U.close();L.refresh();L.toast((selected.size?`${selected.size}件のカテゴリを変更しました。`:'')+(future&&prior?.category!==s.category?'ルールを保存しました。':''));
      };
    }
    configure();
  }
  if(typeof window!=='undefined')window.TallyBulk=Object.freeze({open});
  if(typeof module==='object'&&module.exports)module.exports={normalize,initialForm,preview,projectedRows,ruleStamp,commit};
})();

</script><script>
window.TallyGuide=[{"title":"接頭辞で一括変更・今後も自動分類","lines":["1. 「設定」上部の「接頭辞で一括変更」を開きます。取引の編集画面では「この取引名でカテゴリを一括変更」を選ぶと、入力中の取引名・種別・選択中のカテゴリが最初から入ります。支店名を消して店名だけにするなど、確認前に条件を編集できます。移動しただけでは取引名・日付・金額やカテゴリは保存されません。","2. 対象は選択月または全期間です。表示月以外の取引の編集から開いた場合は、元の取引を含めるため全期間から始まります。「プレビュー」で変更前後と件数を確認し、変更しない行のチェックを外します。「確認へ」→「確定して変更」で反映します。元から同じカテゴリの行は除外します。変更前に閉じれば記録は変わりません。","3. 「今後の取引にも適用」は初めからオンです。オンで確定すると、新しい手入力やPayPay CSVの取り込み時にもルールがカテゴリの初期値になります。既存の候補が0件でも、新しいルールだけ保存できます。一度限りの変更ならオフにします。オフにしても以前から登録しているルールは削除されません。","4. 取引名と接頭辞をNFKC正規化し、前後の空白と大文字・小文字の違いを吸収して先頭から一致するかを調べます。「店名を含む」検索や正規表現ではありません。「ＡＢＣ」と「abc」は同じ接頭辞です。空の接頭辞は登録できません。","5. ルールは収入と支出で別々です。振替を勝手に支出に変えることはありません。複数が当てはまる場合は一番長い接頭辞を優先します。例：「駅ナカ」→食費、「駅ナカ書店」→趣味なら、「駅ナカ書店 本店」は趣味になります。今回の一括変更はプレビューで選んだ明細に対する明示的な変更です。","6. 「設定」→「分類ルール」で今後用のルールだけを追加・編集・削除できます。編集・削除しても過去の明細は変わりません。一括変更で既存と同じ種別・接頭辞を保存すると、そのルールの変更先を更新します。登録は500件までです。","7. CSVの組み込み分類より自分のルールを優先します。プレビュー・手入力ともに、最後に自分で選んだカテゴリを保存します。デモで作ったルールはデモ専用です。実際の取引に使うルールは「自分の家計簿」で登録してください。"]},{"title":"カテゴリを追加する・色を変える","lines":["「設定」→「カテゴリ」→「＋ カテゴリを追加」で、支出または収入を選び、名前を入力します（各100種類まで、1種類32文字以内）。同名・表記ゆれによる重複は登録できません。振替のカテゴリは固定です。","たとえば支出に「ペット」を追加すると、手入力、CSVインポート、接頭辞の分類先に選べます。使用した金額は支出分析・高額順にも反映され、月間予算も設定できます。カテゴリの削除・改名は現在対象外です。","「設定」→「カテゴリ」から色見本を選び「色を保存」を押します。金額や分類そのものは変わりません。円グラフ、ツリーマップ、カテゴリの印、カテゴリ別ランキングに反映されます。「標準色に戻す」を選んだ場合も「色を保存」で確定します。未保存の変更は画面を離れると破棄されます。","カテゴリの色と、収入・支出という種別のグラフ色は別です。支出・収入の棒やカレンダーの濃淡はカテゴリ色ではありません。色とルールは家計簿ごとに保存され、デモには実データの設定を持ち込みません。"]},{"title":"年月・週・日付で期間を指定","lines":["「収支を分析」の「年月指定」で任意の年・月を選ぶと、月初から月末までを表示します。「選択月」はダッシュボードなどで選択した月です。","「週指定」では、週の選択、またはその週に含まれる日付で指定します。週は月曜〜日曜の7日間で、月や年をまたいでも1週として集計します。週入力に対応しない端末では日付を選びます。前週・次週にも切り替えられます。","開始・終了を直接決めるときは「日付指定」。開始日と終了日を含みます。面積図、高額順、カレンダー、年間ヒートマップ、比較レポートは同じ期間・収入／支出・カテゴリ条件を使います。"]},{"title":"旧版から更新する方へ","lines":["先に旧版の「自分の家計簿」→「データ管理」→「バックアップを保存」（旧版は「JSONを保存」）を実行してください。HTMLだけで使う場合は、普段の場所に同名の index.html を置き換え、同じブラウザで開いて再読み込みします。別のフォルダーに展開して旧データが見えない場合も、元の記録は自動では削除されません。必要に応じて保存したJSONを復元してください。"]},{"title":"まずWindowsで使う：インストール不要版","lines":["1. ZIPから使う場合は「すべて展開」します。index.html をたとえば「ドキュメント\\Tally」に置いてください。","2. index.html を Microsoft Edge または Google Chrome で開きます。Windowsだけならインストール・ネット接続・アカウント登録は不要です。","3. 初回は空の「自分の家計簿」が開きます。架空の取引で面積図を試したい場合は「設定」→「表示データ」→「デモデータ」を選びます。サンプルを見ている間だけ、見出しに「デモ表示中」と出ます。同じ設定で「自分の家計簿」に戻れます。デモの既存取引を編集しても自分の記録には影響しません。新規の手入力とCSVのインポートは、デモ表示中も「自分の家計簿」に追加されます。","4. 日々の起動には同じ場所のHTML・同じブラウザ・同じプロファイルを使ってください。家計はHTML自体に書き込まれず、ブラウザの保存領域に記録されます。ファイルの移動・名前変更・ブラウザ変更・プライベートモード・サイトデータ削除で記録にアクセスできなくなることがあります。定期的にJSONバックアップを保存してください。"]},{"title":"手入力・見返し","lines":["・「取引を追加」で種別、日付、金額（正の整数・円）、取引名、カテゴリを入力します。","・「振替」は口座間・残高間のお金の移動として、収入・支出・予算消化に含めません。","・ダッシュボードは月のほか、今週や直近30日、開始日〜終了日を指定して見返せます。収支は選んだ期間の収入−支出で、口座残高ではありません。収入や支出のカードから分析を開くと、同じ期間と種別が引き継がれます。","・月表示では過去6か月／12か月の収支推移を確認できます。他の期間では指定した範囲の中で推移を表示します。最近の取引から明細を選んで編集できます。","・「取引履歴」では年月・検索語・種別・カテゴリで絞り込み、編集・削除できます。","・「予算管理」で支出カテゴリごとの上限を設定します。予算は毎月共通、実績・残額・超過額は表示月ごとです。"]},{"title":"面積図のサイズ・期間を変える","lines":["・「収支を分析」→「面積図・高額順」で、図の右端を左右に、下端を上下にドラッグします。右下のつまみなら幅と高さを同時に変えられます。スマホではつまみを指で動かしてください。枠を変えても、金額に応じたタイルの面積比は変わりません。","・つまみにTabで移動して矢印キーを押しても調整できます。Shiftを押しながらだと大きく変更します。調整したサイズはこのブラウザで次回も使われ、リセットで標準に戻せます。","・図の「期間を変更」を押すと、図を離れずに集計期間を変えられます。「日付指定」は開始日と終了日を含み、同じ日なら1日分です。「年月指定」で任意の1か月、「週指定」で選んだ日を含む月曜〜日曜、「全期間」で記録のある全日付を選べます。「期間を適用」するまで元の図は変わりません。該当する取引がない期間も、同じ場所から選び直せます。","・面積図・選んだ種別の合計・カテゴリ別の高額順には同じ期間が反映されます。分析画面の上部から期間を変更しても同じ結果になり、家計簿全体の表示月や取引自体は変わりません。"]},{"title":"収支を分析：支出と収入を切り替える","lines":["1. 「収支を分析」を開き、「支出」または「収入」を選びます。切り替えても分析期間は同じで、選べるカテゴリが切り替わります。面積図・ランキング・比較は選択した種別だけを使い、振替はどちらにも含めません。","2. 「選択月」「直近90日」「今年」「全期間」を選ぶか、開始日・終了日を入力して「期間を適用」。両端の日を含みます。カテゴリは必要な場合だけ選んでください。","3. 「面積図・高額順」では、大きな金額ほど取引タイルが広く、濃くなります。たとえば1,000円はどのカテゴリでも同じ濃さです。期間や収入・支出を切り替えても濃さの基準は変わりません。タイルの色相は各カテゴリの設定色で、濃さだけが金額で決まります。全体表示の金額見本はグレー、カテゴリを絞るとそのカテゴリ色で表示されます。カテゴリ名や凡例を押すとそのカテゴリを拡大し、取引タイルを押すと明細を編集できます。破線の「その他」はまとめた合計額の濃さで、押すと中身を確認できます。","4. ツリーマップの下の「カテゴリ別 高額取引」で Top 3／5／10 を切り替えます。全カテゴリを横断した上位ではなく、それぞれのカテゴリでの上位です。同額なら新しい日付を優先します。各カテゴリの「全○件を見る」で下位の取引も確認できます。","5. 「カレンダー」では期間内の収支を日別に確認できます。支出はオレンジ、収入は緑です。表示月の中で、選んだ種別の金額が多い日ほど濃くなります。日を選ぶと金額の高い順に明細を表示します。薄い無効な日付は分析期間外です。","6. 「比較レポート」には期間の長さに合わせた日別・7日ごと・月別・年別の棒グラフ、取引名別合計の上位8件、3つ以上の月で同じ名前が現れる繰り返しの支出・収入候補があります。棒や取引名を選ぶと該当する明細が開きます。候補は契約や次回引落しの確定情報ではありません。「印刷」で表示中の分析を印刷／ブラウザでPDFに保存できます。","7. 比較額は、選んだ種別・カテゴリの合計と、直前の同じ日数の合計との差です。前期間に対象の記録がないときは「—」を表示します。振替を支出や収入に加算しません。カテゴリを絞った場合、推移や日別の明細にも同じ条件が反映されます。"]},{"title":"年間ヒートマップ（草カレンダー）：1日1マスでお金の動きを見る","lines":["「収支を分析」→「年間ヒートマップ」では、1マスが1日、縦が月曜〜日曜、横が週です。支出はオレンジ、収入は緑。取引件数ではなく、その日の合計金額で色の濃さが決まります。色ごとの金額の目安は図の凡例で確認できます。","たとえば「収入」→「給与」に絞ると、給料が入った日が並びます。日を押すと、その日・種別・カテゴリに該当する明細だけを確認できます。スマートフォンでは図の中を左右にスクロールできます。","年を切り替えても分析期間は勝手に変わりません。集計対象外の日と、期間内で金額がゼロの日は異なる表示です。1年分を比較したい場合は、図の年全体を対象にするボタンを使います。"]},{"title":"予算・貯蓄目標","lines":["空欄でカテゴリの予算を解除できます。「予算管理」には予算消化率80%以上のカテゴリが表示されます。複数の貯蓄目標に目標額と現在の積立済み額を登録し、進捗を確認できます。積立額は手動更新で、収支明細とは別に保存されます。「返済シミュレーター」は条件を入力して月々の返済額・総額・利息を試算する機能で、実際の家計簿には記帳しません。固定金利・元利均等・毎月払いを仮定し、手数料やボーナス払いは含みません。"]},{"title":"任意：WindowsでSQLiteに保存する","lines":["・Python 3.8以上（SQLite 3.25以上）があれば、ZIPをすべて展開して Start-SQLite.cmd を開きます。初回は空のデータベースです。Windows PCだけで利用でき、取引・予算・貯蓄目標・追加カテゴリ・カテゴリ色・分類ルールが %LOCALAPPDATA%\\Tally\\ledger.sqlite3 に保存されます。カテゴリ別高額順位にはSQLを使用します。","・旧HTML版から移す場合は、旧版で保存したJSONをSQLite版の「データ管理」から復元してください。自動移行はしません。SQLite版とHTML版の家計簿は別々です。詳しくは SQL-NOTES.md をご覧ください。","・SQLiteモードは同じPC内だけで稼働します。AndroidにWindowsのDBをネットワーク公開する機能ではありません。"]},{"title":"他の家計簿から明細を取り込む","lines":["1. 元アプリで取引履歴をファイルに書き出し、Tallyの「データ管理」→「インポート」で取り込み元のカードを選びます。1回に1ファイル、12 MB以下、日本円の取引が対象です。ファイルはこの端末で読み取り、外部には送信しません。","2. 「マネーフォワード ME」は日付・内容・金額・大項目・振替などを含む入出金履歴、「Zaim」は日付・カテゴリ・入金／出金／振替の円金額を含む家計簿CSVに対応します。月別の集計表、資産残高の一覧、レシート画像、アプリ独自のバックアップは明細CSVではありません。専用の形式と見出しが異なる場合は「列を指定して取り込む」を試してください。","3. 「列を指定して取り込む」は、1行目に見出しがあるCSV・TSV向けです。カンマ、タブ、セミコロンの区切りを自動判定します。1件目の値を見ながら日付・取引名と、①種別＋金額、②正負つきの金額、③入金／出金の別列、のいずれかを指定します。支出のみ／収入のみのファイルは「すべて支出／収入」を選べます。種別列・別列式・金額の符号の読み方を混在させないでください。CSVはUTF-8またはShift_JIS（CP932）が使えます。Excelのブックは先にCSVへ書き出してください。","4. 「OFX / QFX」は日本円の銀行・カードの取引明細用です。投資明細や外貨換算は対象外です。「QIF」は円建てであることを確認し、月／日／年と日／月／年が紛らわしい場合は元ファイルの日付順を選んでください。","5. 追加候補・登録済み・除外理由をプレビューで確認し、チェックした行だけを追加します。同名の登録カテゴリは候補に使え、元カテゴリが見つからない場合は「その他支出／その他収入」などから変更できます。分類ルールが一致した場合はルールを優先します。異なるサービスや異なる形式から同じ支払いを取り込む場合、重複を完全には判定できないため片方のチェックを外してください。","6. 「Tally」は「CSVをエクスポート」で書き出した明細を追加するためのものです。設定や予算も含めて端末を引き継ぐ場合はCSVではなく「端末引き継ぎ用にエクスポート」のJSONを使います。"]},{"title":"PayPay CSVをインポート／取引CSVをエクスポート","lines":["1. PayPayアプリ →「取引履歴」→ 右上のダウンロード → 期間を選び申請 → 準備完了の通知からCSVを保存します。詳しくは公式ヘルプ：https://paypay.ne.jp/help/c0447/","2. Tallyの「データ管理」→「インポート」→「PayPay」でファイルを選択します。カード全体を押せます。「CSVをエクスポート」は全期間の登録済み取引を表計算用CSVとして保存します。個人向け取引履歴の円建て入出金に対応し、加盟店用明細やカード請求明細は対象外です。","3. 追加候補、登録済み、読み取り除外、注意メッセージを確認します。行ごとに種別・カテゴリを変えられ、不要な明細はチェックを外せます。「○件をインポート」までは家計簿に追加しません。","4. 店名による自動分類は推定です。チャージ・出金・個人間送金／受け取りは原則「振替」、受け取ったポイントや返金は原則「その他収入」です。立替の精算などは自分の記録方法に合わせて直してください。返金をその他収入とする場合、支出カテゴリ別の合計からは差し引かれません。","5. 再取り込みでは取引番号・内容・入出金方向などで重複を除外します。番号がない場合は日時・金額等で照合するため、期間が重なるCSVは特にご確認ください。手入力した取引とCSVとの重複は自動判定しません。"]},{"title":"データを守る・別の端末へ移す","lines":["1. 送り元で「自分の家計簿」→「データ管理」→「端末引き継ぎ用にエクスポート」を押します。全期間の取引、予算、貯蓄目標、追加カテゴリ・色・分類ルール、CSVの重複照合キーを、表示設定と一緒に1つのJSONに保存します。「CSVをエクスポート」は明細のみで、設定は引き継げません。","2. JSONを新しい端末へ渡し、「データ管理」→「バックアップから復元」で選びます。件数と表示設定の有無を確認して実行してください。統合ではなく全件置換です。移行先に記録があれば先にエクスポートしてください。","3. 表示月、推移の6／12か月、ホームの期間・収支の種別、分析の期間・種別・カテゴリ・表示方法・Top件数、面積図のサイズも反映されます。「直近30日」等は固定日付でなく、新しい端末の今日を基準にします。面積図は端末幅に収まるように表示します。デモへの切り替えや保存先、ブラウザの認証情報は移しません。","・旧形式（v1〜v4）も復元できます。表示設定が含まれないファイルは、端末の表示設定を上書きしません。v1〜v3に追加カテゴリ、v1・v2にカテゴリ色と分類ルール、v1に貯蓄目標はありません。これらの家計設定は復元元に合わせて初期化されます。","・バックアップ・CSVは暗号化されていません。家計情報を含むため共有場所を避け、安全に保管してください。"]},{"title":"任意：家庭内Wi-FiでAndroidから開く","lines":["・Windowsのみで使う方はこの設定は不要です。Androidの実機・機種ごとのファイルマネージャーによるローカルHTMLの扱いは異なるため、次のブラウザ方式を用意しています。","1. ZIPを展開し、Windows側にPython 3.8以降が使える状態で、Start-WiFi.cmd を開きます。複数のIPが表示されたら、自宅のWi-Fi／LANアダプターのものを選びます。","2. AndroidをPCと同じ信頼できる家庭内ネットワークにつなぎ、表示された http://192.168.…:8765/ 等の正確なURLをChromeで開きます。接続中はPCを起動したままにします。","3. Windowsからファイアウォールの確認が出た場合は、必要な場合のみ自宅のプライベートネットワークに限定してください。公共Wi-Fiやルーターのポート転送・インターネット公開は使用しないでください。終了はPC側ウィンドウを閉じるか Ctrl+C。","・配信するのはアプリ画面だけです。Windowsの明細をネットワークに公開しません。データは各端末・各URLに別々に保存され、自動同期されません。Androidに同じ内容を持ち込むには、自分のJSONバックアップを移して復元してください。両方で別々に入力した後の自動マージには対応していません。","・IPやポートが変わるとブラウザの保存先も変わります。Wi-FiやPCの設定を変える前にもバックアップをお勧めします。","・つながらないときは、両端末が同じネットワークにいるか、ゲストWi-Fiの端末間通信制限、Windowsのプライベートネットワーク設定をご確認ください。"]}];

</script><script>
(() => {
  'use strict';const L=window.Ledger,U=window.TallyUI,P=window.TallyPrefs,$=U.$,esc=L.escape;
  let tab='colors';const typeLabel={expense:'支出',income:'収入',transfer:'振替'};
  function ruleForm(index=null){const old=L.rules(),rule=index===null?null:old[index];U.dialog(rule?'分類ルールを編集':'分類ルールを追加',`<form id="rule-form"><div class="form-grid"><label class="field full">取引名の接頭辞<input name="prefix" maxlength="150" value="${esc(rule?.prefix||'')}" placeholder="例：スターバックス" required></label><label class="field">種別<select name="type"><option value="expense">支出</option><option value="income">収入</option></select></label><label class="field">変更先カテゴリ<select name="category"></select></label></div><p role="alert" id="rule-error" class="settings-error"></p><div class="dialog-actions"><button class="btn" type="button" id="rule-cancel">キャンセル</button><button class="btn primary" type="submit">ルールを保存</button></div></form>`,'PREFIX RULE');const f=$('#rule-form'),el=f.elements;const options=()=>el.category.innerHTML=L.categories(el.type.value).map(c=>`<option>${esc(c)}</option>`).join('');el.type.value=rule?.type||'expense';options();if(rule)el.category.value=rule.category;el.type.onchange=options;$('#rule-cancel').onclick=U.close;f.onsubmit=ev=>{ev.preventDefault();const entry={type:el.type.value,prefix:el.prefix.value,category:el.category.value};try{const next=rule?old.map((r,i)=>i===index?entry:r):[...old,entry];L.setRules(next)}catch(err){$('#rule-error').textContent=err.message;return}U.close();L.refresh();L.toast('分類ルールを保存しました。')}}
  function categoryForm(){U.dialog('カテゴリを追加',`<form id="cfg-category-form"><div class="form-grid"><label class="field full">種別<select name="type"><option value="expense">支出</option><option value="income">収入</option></select></label><label class="field full">カテゴリ名<input type="text" name="name" maxlength="32" required placeholder="例：ペット・旅行・推し活" autocomplete="off"></label></div><p class="settings-error" role="alert" id="cfg-category-error"></p><div class="dialog-actions"><button class="btn" type="button" id="cfg-cat-cancel">キャンセル</button><button class="btn primary" type="submit">カテゴリを追加</button></div></form>`,'NEW CATEGORY');const f=$('#cfg-category-form');$('#cfg-cat-cancel').onclick=U.close;f.onsubmit=ev=>{ev.preventDefault();let name;try{name=L.addCategory(f.elements.type.value,f.elements.namedItem('name').value)}catch(err){$('#cfg-category-error').textContent=err.message;return}U.close();L.refresh();L.toast(`「${name}」を追加しました。`)};f.elements.namedItem('name').focus()}
  function settings(){const root=$('#page');root.innerHTML=`<div class="cfg-toolbar"><div class="cfg-tabs"><button data-config="colors" aria-pressed="${tab==='colors'}">カテゴリ</button><button data-config="rules" aria-pressed="${tab==='rules'}">分類ルール</button><button data-config="display" aria-pressed="${tab==='display'}">表示データ</button></div><button class="btn cfg-batch-button" id="cfg-bulk">${U.icon('layers')}接頭辞で一括変更</button></div><div id="cfg-body"></div>`;root.querySelectorAll('[data-config]').forEach(b=>b.onclick=()=>{if(tab===b.dataset.config)return;tab=b.dataset.config;settings();U.enter($('#cfg-body'))});$('#cfg-bulk').onclick=()=>window.TallyBulk.open();const box=$('#cfg-body');if(tab==='display'){
      const demo=L.isDemo();box.innerHTML=`<section class="panel cfg-panel"><div class="cfg-head"><div><div class="eyebrow">DISPLAY</div><h2>表示する家計簿</h2></div></div><div class="cfg-datasets">${[['actual-mode','wallet','自分の家計簿','登録した取引や予算を表示します。',!demo],['demo-mode','chart','デモデータ','架空の取引で面積図などを試せます。自分の記録とは別です。',demo]].map(([id,ic,title,desc,on])=>`<button type="button" class="cfg-dataset" id="${id}" aria-pressed="${on}"><span class="cfg-dataset-icon">${U.icon(ic)}</span><span><b>${title}</b><small>${desc}</small></span><span class="cfg-radio" aria-hidden="true"></span></button>`).join('')}</div></section>`;
      const switchTo=(isDemo,id)=>{if(L.isDemo()!==isDemo){U.setMode(isDemo);$(id).focus();L.toast(isDemo?'デモデータを表示しています。':'自分の家計簿に戻りました。')}};$('#actual-mode').onclick=()=>switchTo(false,'#actual-mode');$('#demo-mode').onclick=()=>switchTo(true,'#demo-mode');return
    }if(tab==='rules'){
    const rules=L.rules();box.innerHTML=`<section class="panel cfg-panel"><div class="cfg-head"><div><div class="eyebrow">PREFIX RULES</div><h2>分類ルール <span class="cfg-count">${rules.length}</span></h2></div><div class="cfg-actions"><button class="btn primary" id="cfg-add">＋ ルールを追加</button></div></div>${rules.length?`<div class="cfg-list">${rules.map((r,i)=>`<div class="cfg-rule"><div><small>${typeLabel[r.type]}</small><b>${esc(r.prefix)}</b></div><span class="cfg-dest"><i style="background:${U.color[r.category]}"></i>${esc(r.category)}</span><div><button data-red="${i}" class="btn">編集</button> <button data-rdel="${i}" class="btn">削除</button></div></div>`).join('')}</div>`:'<p class="empty">分類ルールはまだありません。</p>'}</section>`;$('#cfg-add').onclick=()=>ruleForm();box.querySelectorAll('[data-red]').forEach(b=>b.onclick=()=>ruleForm(+b.dataset.red));box.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=()=>{const i=+b.dataset.rdel,r=rules[i];L.confirm('分類ルールを削除しますか？',`「${r.prefix}」→「${r.category}」を削除します。登録済み取引のカテゴリは変わりません。`,()=>{try{L.setRules(rules.filter((x,j)=>j!==i))}catch{return}L.refresh();L.toast('分類ルールを削除しました。')})});return}
    const start={...U.color};box.innerHTML=`<form class="panel cfg-panel" id="color-form"><div class="cfg-head"><div><div class="eyebrow">CATEGORY PALETTE</div><h2>カテゴリと配色</h2></div><div class="cfg-actions"><button type="button" class="btn" id="cfg-reset">標準色に戻す</button><button type="button" class="btn primary" id="cfg-category-add">＋ カテゴリを追加</button></div></div>${Object.entries(typeLabel).map(([type,name])=>`<fieldset class="cfg-group"><legend>${name}</legend><div class="cfg-swatches">${L.categories(type).map(c=>`<label class="cfg-color"><span class="cfg-icon" style="--paint:${start[c]}">${U.icon(U.catIcon[c])}</span><span><b>${esc(c)}</b><small>${start[c].toUpperCase()}</small></span><input aria-label="${esc(c)}の色" data-color="${esc(c)}" type="color" value="${start[c]}"></label>`).join('')}</div></fieldset>`).join('')}<div class="cfg-foot"><span id="cfg-status" role="status"></span><button type="submit" id="cfg-save" class="btn primary">色を保存</button></div></form>`;
    $('#cfg-category-add').onclick=()=>{if(!$('#cfg-save').disabled&&!window.confirm('未保存の色変更を破棄して、カテゴリの追加に進みますか？'))return;categoryForm()};const fields=[...box.querySelectorAll('[data-color]')];function preview(n){const l=n.closest('label');l.querySelector('small').textContent=n.value.toUpperCase();l.querySelector('.cfg-icon').style.setProperty('--paint',n.value)}function update(){const dirty=fields.some(n=>start[n.dataset.color].toLowerCase()!==n.value.toLowerCase());$('#cfg-save').disabled=!dirty;$('#cfg-status').textContent=dirty?'未保存の変更':''}fields.forEach(n=>{n.oninput=n.onchange=()=>{preview(n);update()}});$('#cfg-reset').onclick=()=>{fields.forEach(n=>{n.value=P.defaultColor(n.dataset.color);preview(n)});update()};$('#color-form').onsubmit=ev=>{ev.preventDefault();const changes=Object.fromEntries(fields.filter(n=>n.value!==P.defaultColor(n.dataset.color)).map(n=>[n.dataset.color,n.value]));try{L.setColors(changes)}catch{return}L.refresh();L.toast('カテゴリ色を保存しました。')};update()
  }
  function help(){const root=$('#page');root.innerHTML='<section class="panel cfg-panel"><div class="cfg-head"><div><div class="eyebrow">USER GUIDE</div><h2>操作ガイド</h2></div><label class="cfg-search"><input type="search" aria-label="使い方を検索" placeholder="使い方を検索" id="guide-search"></label></div><div id="guide-results"></div></section>';const result=$('#guide-results');function content(){const term=P.norm($('#guide-search').value),items=window.TallyGuide.filter(x=>P.norm(x.title+' '+x.lines.join(' ')).includes(term));result.innerHTML=items.map((x,i)=>`<details class="guide-item" ${term?'open':''}><summary><span>${String(i+1).padStart(2,'0')}</span>${esc(x.title)}</summary><div>${x.lines.map(line=>`<p>${esc(line)}</p>`).join('')}</div></details>`).join('')||'<p class="empty">該当する説明はありません。</p>'}$('#guide-search').oninput=content;content()}
  window.TallySettings=settings;window.TallyHelp=help;
})();
</script></body></html>
